<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Cocktail Book</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e0c0a;
    --surface: #1a1612;
    --surface2: #231e19;
    --gold: #c9a84c;
    --gold-light: #e8c97a;
    --amber: #d4681e;
    --text: #f0e8dc;
    --text-dim: #8a7e72;
    --border: #2e2820;
    --tag-bg: #2a2218;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    min-height: 100vh;
  }

  /* Grain overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    pointer-events: none;
    z-index: 1000;
    opacity: 0.4;
  }

  header {
    text-align: center;
    padding: 60px 24px 40px;
    border-bottom: 1px solid var(--border);
    position: relative;
  }

  header::after {
    content: '';
    position: absolute;
    bottom: -1px;
    left: 50%;
    transform: translateX(-50%);
    width: 80px;
    height: 2px;
    background: var(--gold);
  }

  .header-eyebrow {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 16px;
  }

  h1 {
    font-family: 'Playfair Display', serif;
    font-size: clamp(2.4rem, 6vw, 4rem);
    font-weight: 400;
    color: var(--text);
    line-height: 1.1;
    margin-bottom: 8px;
  }

  h1 em {
    font-style: italic;
    color: var(--gold-light);
  }

  .header-count {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 12px;
  }

  /* Controls */
  .controls {
    max-width: 900px;
    margin: 36px auto 0;
    padding: 0 24px;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
  }

  .search-wrap {
    flex: 1;
    min-width: 200px;
    position: relative;
  }

  .search-wrap svg {
    position: absolute;
    left: 14px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--text-dim);
    pointer-events: none;
  }

  input[type="search"] {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    padding: 11px 14px 11px 40px;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="search"]:focus { border-color: var(--gold); }
  input[type="search"]::placeholder { color: var(--text-dim); }

  .filter-btn {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text-dim);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    padding: 11px 16px;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .filter-btn:hover, .filter-btn.active {
    border-color: var(--gold);
    color: var(--gold);
    background: var(--tag-bg);
  }

  /* Grid */
  .grid {
    max-width: 900px;
    margin: 32px auto 60px;
    padding: 0 24px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
  }

  /* Card */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
    animation: fadeUp 0.4s ease both;
  }

  .card:hover {
    transform: translateY(-3px);
    border-color: var(--gold);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .card-top {
    padding: 22px 22px 16px;
    border-bottom: 1px solid var(--border);
  }

  .card-spirit {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 8px;
  }

  .card-name {
    font-family: 'Playfair Display', serif;
    font-size: 1.5rem;
    font-weight: 400;
    line-height: 1.2;
  }

  .card-body {
    padding: 16px 22px 20px;
  }

  .card-ingredients {
    list-style: none;
    margin-bottom: 14px;
  }

  .card-ingredients li {
    font-size: 13px;
    color: var(--text-dim);
    padding: 3px 0;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    gap: 8px;
  }

  .card-ingredients li:last-child { border-bottom: none; }

  .ing-amount {
    color: var(--gold-light);
    font-weight: 500;
    white-space: nowrap;
    font-size: 12px;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-top: 12px;
  }

  .tag {
    background: var(--tag-bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    font-size: 10px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-dim);
    padding: 3px 8px;
  }

  .card-method {
    font-size: 12px;
    color: var(--text-dim);
    font-style: italic;
    margin-top: 10px;
    line-height: 1.5;
  }

  /* Modal */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.75);
    backdrop-filter: blur(4px);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
  }

  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    max-width: 480px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    transform: scale(0.95);
    transition: transform 0.25s;
  }

  .modal-overlay.open .modal { transform: scale(1); }

  .modal-header {
    padding: 28px 28px 20px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--surface2);
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: 16px;
  }

  .modal-spirit {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 6px;
  }

  .modal-name {
    font-family: 'Playfair Display', serif;
    font-size: 2rem;
    font-weight: 400;
  }

  .modal-close {
    background: none;
    border: 1px solid var(--border);
    border-radius: 50%;
    color: var(--text-dim);
    cursor: pointer;
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    font-size: 18px;
    line-height: 1;
    transition: all 0.2s;
  }

  .modal-close:hover { border-color: var(--gold); color: var(--gold); }

  .modal-body { padding: 24px 28px 32px; }

  .modal-section-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 12px;
    margin-top: 24px;
  }

  .modal-section-label:first-child { margin-top: 0; }

  .modal-ingredients {
    list-style: none;
  }

  .modal-ingredients li {
    display: flex;
    justify-content: space-between;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
    gap: 12px;
  }

  .modal-ingredients li:last-child { border-bottom: none; }

  .modal-amount {
    color: var(--gold-light);
    font-weight: 500;
    white-space: nowrap;
  }

  .modal-method {
    font-size: 14px;
    color: var(--text-dim);
    line-height: 1.7;
  }

  .modal-notes {
    font-size: 13px;
    color: var(--text-dim);
    font-style: italic;
    line-height: 1.6;
    background: var(--tag-bg);
    border-left: 2px solid var(--gold);
    padding: 12px 16px;
    border-radius: 0 6px 6px 0;
  }

  .no-results {
    text-align: center;
    padding: 60px 24px;
    color: var(--text-dim);
    font-style: italic;
    grid-column: 1/-1;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--gold);
    margin: 8px 0 0;
  }
</style>
</head>
<body>

<header>
  <div class="header-eyebrow">Personal Collection</div>
  <h1>My <em>Cocktail</em> Book</h1>
  <div class="divider" style="margin: 16px auto 0;"></div>
  <p class="header-count" id="count"></p>
</header>

<div class="controls">
  <div class="search-wrap">
    <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    <input type="search" id="search" placeholder="Search drinks or ingredients…">
  </div>
  <button class="filter-btn active" data-filter="all">All</button>
  <button class="filter-btn" data-filter="rum">Rum</button>
  <button class="filter-btn" data-filter="tequila">Tequila</button>
  <button class="filter-btn" data-filter="gin">Gin</button>
  <button class="filter-btn" data-filter="whiskey">Whiskey</button>
  <button class="filter-btn" data-filter="tiki">Tiki</button>
  <button class="filter-btn" data-filter="stirred">Stirred</button>
  <button class="filter-btn" data-filter="mezcal">Mezcal</button>
  <button class="filter-btn" data-filter="vodka">Vodka</button>
</div>

<div class="grid" id="grid"></div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <div>
        <div class="modal-spirit" id="mSpirit"></div>
        <div class="modal-name" id="mName"></div>
      </div>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div class="modal-body">
      <div class="modal-section-label">Ingredients</div>
      <ul class="modal-ingredients" id="mIngredients"></ul>
      <div id="mMethodWrap" style="display:none">
        <div class="modal-section-label">Method</div>
        <p class="modal-method" id="mMethod"></p>
      </div>
      <div id="mNotesWrap" style="display:none">
        <div class="modal-section-label">Notes</div>
        <p class="modal-notes" id="mNotes"></p>
      </div>
    </div>
  </div>
</div>

// Render
const grid = document.getElementById('grid');
const countEl = document.getElementById('count');
let activeFilter = 'all';
let searchTerm = '';

function getCardIngredients(recipe) {
  return recipe.ingredients.slice(0, 4).map(i =>
    `<li><span>${i.name}</span><span class="ing-amount">${i.amount}</span></li>`
  ).join('') + (recipe.ingredients.length > 4 ? `<li style="color:var(--text-dim);font-style:italic">+${recipe.ingredients.length - 4} more…</li>` : '');
}

function render() {
  const filtered = recipes.filter(r => {
    const matchFilter = activeFilter === 'all' || r.tags.includes(activeFilter);
    const q = searchTerm.toLowerCase();
    const matchSearch = !q || r.name.toLowerCase().includes(q) ||
      r.ingredients.some(i => i.name.toLowerCase().includes(q)) ||
      r.spirit.toLowerCase().includes(q);
    return matchFilter && matchSearch;
  });

  countEl.textContent = `${filtered.length} of ${recipes.length} recipes`;

  grid.innerHTML = filtered.length === 0
    ? `<div class="no-results">No cocktails match your search.</div>`
    : filtered.map((r, i) => `
      <div class="card" data-index="${recipes.indexOf(r)}" style="animation-delay:${i * 0.05}s">
        <div class="card-top">
          <div class="card-spirit">${r.spirit}</div>
          <div class="card-name">${r.name}</div>
        </div>
        <div class="card-body">
          <ul class="card-ingredients">${getCardIngredients(r)}</ul>
          <div class="card-tags">${r.tags.map(t => `<span class="tag">${t}</span>`).join('')}</div>
        </div>
      </div>
    `).join('');

  grid.querySelectorAll('.card').forEach(card => {
    card.addEventListener('click', () => openModal(parseInt(card.dataset.index)));
  });
}

// Modal
const overlay = document.getElementById('modalOverlay');
const mName = document.getElementById('mName');
const mSpirit = document.getElementById('mSpirit');
const mIngredients = document.getElementById('mIngredients');
const mMethod = document.getElementById('mMethod');
const mMethodWrap = document.getElementById('mMethodWrap');
const mNotes = document.getElementById('mNotes');
const mNotesWrap = document.getElementById('mNotesWrap');

function openModal(idx) {
  const r = recipes[idx];
  mSpirit.textContent = r.spirit;
  mName.textContent = r.name;
  mIngredients.innerHTML = r.ingredients.map(i =>
    `<li><span>${i.name}</span><span class="modal-amount">${i.amount}</span></li>`
  ).join('');
  if (r.method) {
    mMethod.textContent = r.method;
    mMethodWrap.style.display = 'block';
  } else {
    mMethodWrap.style.display = 'none';
  }
  if (r.notes) {
    mNotes.textContent = r.notes;
    mNotesWrap.style.display = 'block';
  } else {
    mNotesWrap.style.display = 'none';
  }
  overlay.classList.add('open');
}

document.getElementById('modalClose').addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') overlay.classList.remove('open'); });

document.getElementById('search').addEventListener('input', e => {
  searchTerm = e.target.value;
  render();
});

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeFilter = btn.dataset.filter;
    render();
  });
});

render();
</script>
</body>
</html>
